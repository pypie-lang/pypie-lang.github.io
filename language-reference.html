<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyPie - Manual</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <script>
        (() => {
            try {
                const theme = localStorage.getItem("pypie.theme");
                if (theme === "dark" || theme === "light") {
                    document.documentElement.dataset.theme = theme;
                } else if (theme === "theme-dark") {
                    document.documentElement.dataset.theme = "dark";
                } else if (theme === "theme-solaris") {
                    document.documentElement.dataset.theme = "light";
                }
            } catch {}
        })();
    </script>
    <link rel="stylesheet" href="assets/site.css">
</head>
<body>
    <div data-top-actions></div>
    <main class="page">
        <div>
            <h1>Manual</h1>
            <p>The language reference now lives in the chapter-based manual. Start with the guide, then expand chapter by chapter as the reference grows.</p>
            <a class="btn" href="manual/guide/index.html">Open The PyPie Guide</a>
        </div>
    </main>
    <script src="site-manifest.js"></script>
    <script src="top-actions.js"></script>
</body>
</html>
