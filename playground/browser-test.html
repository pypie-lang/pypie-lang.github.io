<!DOCTYPE html>
<!--
Browser smoke test for the playground worker. Serve the site (for example
`python3 -m http.server 8000`), open /playground/browser-test.html, and wait
for PASS/FAIL lines. Each step is also reported as a GET /log?msg=... request
so a headless run can be observed from the server log (the 404s are fine).
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PyPie playground worker test</title>
</head>
<body>
<h1>PyPie playground worker test</h1>
<pre id="out">starting…</pre>
<script>
const out = document.getElementById("out");
const log = (msg) => {
    out.textContent += "\n" + msg;
    fetch("/log?msg=" + encodeURIComponent(msg)).catch(() => {});
};
const worker = new Worker("./dist/pyodide-worker.js?v=browser-test", { type: "module" });
let id = 0;
const pending = new Map();
worker.addEventListener("message", (event) => {
    const m = event.data;
    const p = pending.get(m.id);
    if (!p) return;
    pending.delete(m.id);
    m.ok ? p.resolve(m.result) : p.reject(new Error(m.error));
});
worker.addEventListener("error", (event) => {
    log("WORKER_ERROR " + event.message + " @ " + event.filename + ":" + event.lineno);
});
const request = (type, payload = {}) => new Promise((resolve, reject) => {
    const i = ++id;
    pending.set(i, { resolve, reject });
    worker.postMessage({ id: i, type, payload });
});
(async () => {
    try {
        log("INIT_START (loading Pyodide + wheel, takes a little while)");
        const status = await request("init");
        log("INIT_OK " + JSON.stringify(status));
        const source = await (await fetch("./examples/line.py")).text();
        const analysis = await request("analyzeSource", { source, version: 1 });
        log("ANALYZE_OK diagnostics=" + analysis.diagnostics.length);
        const run = await request("runSource", { source });
        log("RUN_OK stdout=" + JSON.stringify(run.stdout).slice(0, 200));
        log("PASS");
    } catch (error) {
        log("FAIL " + (error && error.message ? error.message : String(error)));
    }
})();
</script>
</body>
</html>
