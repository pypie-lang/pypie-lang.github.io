<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyPie Playground</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap");

        :root {
            --page-bg: #f7f8f8;
            --text-color: #1f2933;
            --muted-text: #65737f;
            --surface: #ffffff;
            --surface-2: #edf2f4;
            --border: #c6d0d5;
            --accent: #0f766e;
            --accent-2: #b45309;
            --danger: #b42318;
            --top-bar-bg: #212529;
            --btn-text: #f8f9fa;
            --btn-border: #f8f9fa;
            --theme-toggle-bg: #fdf6e3;
            --editor-bg: #fbfcfd;
            --editor-gutter: #e8eef1;
            --shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
        }

        body.theme-solaris {
            --page-bg: #fdf6e3;
            --text-color: #586e75;
            --muted-text: #75868a;
            --surface: #fffaf0;
            --surface-2: #eee8d5;
            --border: #c9bfa9;
            --accent: #2aa198;
            --accent-2: #b58900;
            --danger: #dc322f;
            --top-bar-bg: #e7ddc7;
            --btn-text: #586e75;
            --btn-border: #93a1a1;
            --theme-toggle-bg: #343a40;
            --editor-bg: #fffaf0;
            --editor-gutter: #eee8d5;
        }

        body.theme-dark {
            --page-bg: #1f252b;
            --text-color: #eef4f8;
            --muted-text: #a7b4bd;
            --surface: #2a3138;
            --surface-2: #20262c;
            --border: #48545e;
            --accent: #2dd4bf;
            --accent-2: #f59e0b;
            --danger: #f97066;
            --top-bar-bg: #161b20;
            --btn-text: #f8f9fa;
            --btn-border: #7b8790;
            --theme-toggle-bg: #fdf6e3;
            --editor-bg: #20262c;
            --editor-gutter: #181d22;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page-bg);
            color: var(--text-color);
            font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
            overflow: hidden;
        }

        .top-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: clamp(0.5rem, 2vh, 1rem) 2rem;
            background-color: var(--top-bar-bg);
            position: relative;
        }

        .top-actions .btn {
            color: var(--btn-text);
            text-decoration: none;
            border: 1px solid var(--btn-border);
            padding: 0.5rem 1.25rem;
            border-radius: 4px;
            font-weight: 600;
            background: transparent;
            cursor: pointer;
            font: inherit;
        }

        .theme-toggle {
            position: absolute;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            padding: 0;
            border-radius: 999px;
            border: 1px solid var(--btn-border);
            background: var(--theme-toggle-bg);
            cursor: pointer;
        }

        .theme-toggle:focus-visible,
        button:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .playground {
            height: calc(100vh - 56px);
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(26rem, 1.5fr) minmax(20rem, 0.8fr);
            gap: 0;
        }

        .editor-column,
        .side-column {
            min-height: 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .editor-column {
            border-right: 1px solid var(--border);
        }

        .toolbar {
            min-height: 3.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 0.75rem;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .toolbar-spacer {
            flex: 1 1 auto;
        }

        .status {
            color: var(--muted-text);
            font-size: 0.875rem;
            white-space: nowrap;
            max-width: 38%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        button,
        select {
            height: 2rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface);
            color: var(--text-color);
            font: inherit;
        }

        button {
            padding: 0 0.75rem;
            cursor: pointer;
            font-weight: 600;
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        button[aria-pressed="true"] {
            border-color: var(--accent-2);
            color: var(--accent-2);
        }

        button:disabled {
            cursor: default;
            opacity: 0.55;
        }

        select {
            padding: 0 2rem 0 0.5rem;
            max-width: 15rem;
        }

        #editor {
            flex: 1 1 auto;
            min-height: 0;
            min-width: 0;
            background: var(--editor-bg);
        }

        .cm-editor {
            height: 100%;
            min-width: 0;
            background: var(--editor-bg);
            color: var(--text-color);
            font-family: "IBM Plex Mono", "Courier New", monospace;
            font-size: 0.95rem;
        }

        .cm-gutters {
            background: var(--editor-gutter) !important;
            color: var(--muted-text) !important;
            border-right-color: var(--border) !important;
        }

        .side-section {
            min-height: 0;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        .side-section:last-child {
            border-bottom: 0;
        }

        .side-header {
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.75rem;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
            font-weight: 600;
        }

        .side-body {
            min-height: 0;
            overflow: auto;
            padding: 0.75rem;
        }

        .diagnostics {
            flex: 0 0 9.5rem;
        }

        .inputs {
            flex: 0 0 14rem;
        }

        .output {
            flex: 1 1 auto;
        }

        .empty-state {
            color: var(--muted-text);
            font-size: 0.9rem;
        }

        .diagnostic-item {
            border-left: 3px solid var(--danger);
            padding: 0.25rem 0 0.25rem 0.5rem;
            margin-bottom: 0.5rem;
            font-family: "IBM Plex Mono", "Courier New", monospace;
            font-size: 0.85rem;
            line-height: 1.45;
        }

        .input-row {
            display: grid;
            grid-template-columns: minmax(4rem, 7rem) 1fr;
            gap: 0.5rem;
            align-items: start;
            margin-bottom: 0.75rem;
        }

        .input-meta {
            color: var(--muted-text);
            font-family: "IBM Plex Mono", "Courier New", monospace;
            font-size: 0.75rem;
            overflow-wrap: anywhere;
        }

        textarea {
            width: 100%;
            min-height: 4rem;
            resize: vertical;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--editor-bg);
            color: var(--text-color);
            font: 0.85rem/1.45 "IBM Plex Mono", "Courier New", monospace;
            padding: 0.5rem;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font: 0.85rem/1.5 "IBM Plex Mono", "Courier New", monospace;
        }

        .cm-tooltip.pypie-hover {
            max-width: min(32rem, 80vw);
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface);
            color: var(--text-color);
            box-shadow: var(--shadow);
            padding: 0.5rem;
            font: 0.82rem/1.45 "IBM Plex Mono", "Courier New", monospace;
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            .playground {
                height: auto;
                min-height: calc(100vh - 56px);
                grid-template-columns: 1fr;
            }

            .editor-column {
                min-height: 58vh;
                border-right: 0;
                border-bottom: 1px solid var(--border);
            }

            .side-column {
                min-height: 42vh;
            }

            .status {
                display: none;
            }

            .toolbar {
                flex-wrap: wrap;
                height: auto;
            }

            .top-actions {
                gap: 0.5rem;
                padding-inline: 3rem;
                overflow-x: auto;
                justify-content: flex-start;
            }

            .top-actions .btn {
                padding-inline: 0.75rem;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body class="theme-solaris">
    <div data-top-actions></div>
    <main class="playground">
        <section class="editor-column" aria-label="Editor">
            <div class="toolbar">
                <select id="sample-select" aria-label="Sample">
                    <option value="line" selected>Baseline Line</option>
                    <option value="add">Vector Add</option>
                    <option value="matmul">Matrix Multiply</option>
                    <option value="reduce">Reduce Mean</option>
                </select>
                <button id="run-button" class="primary" type="button">Run</button>
                <button id="stop-button" type="button">Stop</button>
                <button id="vim-button" type="button" aria-pressed="false">Vim</button>
                <div class="toolbar-spacer"></div>
                <div id="runtime-status" class="status">Starting</div>
            </div>
            <div id="editor"></div>
        </section>
        <aside class="side-column" aria-label="Run panels">
            <section class="side-section diagnostics">
                <div class="side-header">
                    <span>Diagnostics</span>
                    <span id="diagnostic-count">0</span>
                </div>
                <div id="diagnostics" class="side-body"></div>
            </section>
            <section class="side-section inputs">
                <div class="side-header">
                    <span>Script</span>
                    <span id="entry-name">playground.py</span>
                </div>
                <div id="inputs" class="side-body"></div>
            </section>
            <section class="side-section output">
                <div class="side-header">
                    <span>Output</span>
                    <span id="backend-name">TFJS WASM</span>
                </div>
                <div class="side-body">
                    <pre id="output"></pre>
                </div>
            </section>
        </aside>
    </main>
    <script src="../top-actions.js"></script>
    <script src="./dist/main.js?v=20260608-firefox-file-guard-a"></script>
</body>
</html>
