<!DOCTYPE html>
<!-- Temporary harness: drives the playground worker headlessly and reports
     each step to the local server log via fetch("/log?..."). Delete me. -->
<html>
<body>
<script>
const log = (msg) => fetch("/log?msg=" + encodeURIComponent(msg)).catch(() => {});
const worker = new Worker("./dist/pyodide-worker.js?v=selftest-module-1", { type: "module" });
let id = 0;
const pending = new Map();
worker.addEventListener("message", (event) => {
    const m = event.data;
    const p = pending.get(m.id);
    if (!p) return;
    pending.delete(m.id);
    m.ok ? p.resolve(m.result) : p.reject(new Error(m.error));
});
worker.addEventListener("error", (event) => {
    log("WORKER_ERROR " + event.message + " @ " + event.filename + ":" + event.lineno);
});
const request = (type, payload = {}) => new Promise((resolve, reject) => {
    const i = ++id;
    pending.set(i, { resolve, reject });
    worker.postMessage({ id: i, type, payload });
});
(async () => {
    try {
        log("INIT_START");
        const status = await request("init");
        log("INIT_OK " + JSON.stringify(status));
        const source = await (await fetch("./examples/line.py")).text();
        const analysis = await request("analyzeSource", { source, version: 1 });
        log("ANALYZE_OK diagnostics=" + analysis.diagnostics.length);
        const run = await request("runSource", { source });
        log("RUN_OK stdout=" + JSON.stringify(run.stdout).slice(0, 200));
    } catch (error) {
        log("FAIL " + (error && error.message ? error.message : String(error)));
    }
})();
</script>
</body>
</html>
